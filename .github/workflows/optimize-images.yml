name: Optimize images

permissions: 
  contents: write
  pull-requests: write

on:
  pull_request:
    branches: [ master, main, release/** ]
    paths:
      - "**/*.png"

  push:
    branches: [ master, main, release/** ]
    paths:
      - "**/*.png"

jobs:
  optimize-images:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/optimize-images.yml@master
    secrets: inherit
